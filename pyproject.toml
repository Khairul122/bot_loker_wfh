[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-loker-wfh"
version = "0.1.0"
description = "Bot personal untuk sourcing dan review lowongan kerja remote."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[project.scripts]
bot-loker-wfh = "bot_loker_wfh.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bot_loker_wfh = ["migrations/*.sql", "office/*", "office/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

