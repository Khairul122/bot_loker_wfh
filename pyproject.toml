[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-loker-wfh"
version = "0.1.0"
description = "Bot personal untuk sourcing dan review lowongan kerja remote."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
form = ["playwright>=1.40"]

[project.scripts]
bot-loker-wfh = "bot_loker_wfh.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

