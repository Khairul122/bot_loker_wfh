<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kantor Loker WFH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff8ee; --paper-2:#fbecd9; --ink:#4a3426; --ink-soft:#8a6b55; --line:#ecd6bd;
  --accent:#f08a5d; --accent-2:#6bb38a; --sky:#cfe9f5; --shadow:0 10px 30px rgba(92,58,30,.18);
  --good:#5cb87a; --mid:#f2b84b; --low:#ef8a6b; --idle:#a9b4c8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe9f5;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
#app canvas{display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;font-weight:800}
#top{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
#brand{font-size:15px}
#brand .dot{width:10px;height:10px;border-radius:50%;background:var(--idle)}
#brand .dot.live{background:var(--good);box-shadow:0 0 0 4px rgba(92,184,122,.25)}
#tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{min-width:46px;height:46px;padding:0 14px;border-radius:16px;font-size:20px;display:inline-flex;align-items:center;gap:6px;font-weight:800}
.tbtn span{font-size:14px}
.tbtn:hover,.tbtn.on{background:var(--paper-2)}
.tbtn.on{border-color:var(--accent)}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(74,52,38,.45);display:none;pointer-events:none}
#nav{position:fixed;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:8px}
#nav button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;font-weight:700;font-size:14px;text-align:left;white-space:nowrap}
#nav button:hover,#nav button.on{background:var(--paper-2)}
#nav button i{font-style:normal;font-size:18px;width:24px;text-align:center}
#nav hr{border:0;border-top:2px dashed var(--line);margin:4px 6px;width:auto}
#hud{position:fixed;left:14px;bottom:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 28px)}
.face{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none;border:3px solid #fff;box-shadow:0 3px 0 var(--line)}
#hud .name{font-weight:900;font-size:16px}
#hud .mood{font-size:13px;color:var(--ink-soft);font-weight:700}
.meter{height:9px;border-radius:9px;background:var(--paper-2);overflow:hidden;width:120px;margin-top:4px}
.meter b{display:block;height:100%;border-radius:9px;background:var(--accent-2);transition:width .4s}
.emotes{display:flex;gap:4px;margin-left:4px}
.emotes button{width:40px;height:40px;border-radius:12px;font-size:20px;background:var(--paper-2)}
.emotes button:hover{background:var(--line)}
#score{font-weight:900;font-size:14px;color:var(--ink-soft)}
#card{position:fixed;right:14px;bottom:14px;width:300px;padding:16px;display:none}
#card.show{display:block;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
#card .head{display:flex;gap:12px;align-items:center}
#card .who{font-weight:900;font-size:18px;line-height:1.1}
#card .role{font-size:13px;color:var(--ink-soft);font-weight:700}
#card .close{position:absolute;right:10px;top:8px;font-size:18px;width:32px;height:32px;border-radius:10px}
.row{display:flex;align-items:center;gap:14px;margin:14px 0 10px}
.ring{--p:0;--c:var(--good);width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--paper-2) 0)}
.ring>div{width:56px;height:56px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:26px}
.stars{font-size:18px;letter-spacing:1px;color:#f2b84b}
.stars .off{color:#e7d6c2}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{background:var(--paper-2);border-radius:12px;padding:4px 9px;font-weight:800;font-size:13px;display:inline-flex;gap:5px;align-items:center}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acts button{padding:8px 0;border-radius:14px;background:var(--paper-2);font-size:22px;display:flex;flex-direction:column;align-items:center;font-weight:800}
.acts button small{font-size:11px;color:var(--ink-soft)}
.acts button:hover{background:var(--line)}
.hunt{display:none;width:100%;margin-top:10px;padding:10px;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;font-size:14px}
.hunt:disabled{opacity:.6;cursor:wait}
.leads{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:210px;overflow:auto}
.leads li a{display:block;padding:7px 10px;border-radius:12px;background:var(--paper-2);color:var(--ink);text-decoration:none;font-weight:800;font-size:13px}
.leads li a:hover{background:var(--line)}
.leads li small{display:block;color:var(--ink-soft);font-weight:700}
#perf{position:fixed;inset:0;background:rgba(74,52,38,.28);display:none;align-items:center;justify-content:center;padding:16px}
#perf.show{display:flex}
#perf .panel{width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
#perf h2{margin:0;font-size:22px;font-weight:900}
#perf .sub{color:var(--ink-soft);font-weight:700;font-size:14px;margin:2px 0 16px}
.funnel{display:flex;align-items:flex-end;gap:8px;margin-bottom:22px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:92px;text-align:center}
.step .bar{margin:0 auto 6px;width:100%;border-radius:14px 14px 6px 6px;display:grid;place-items:center;font-size:24px;min-height:44px;transition:height .5s}
.step b{display:block;font-size:20px;font-weight:900}
.step small{font-weight:700;color:var(--ink-soft);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ecard{text-align:left;padding:12px;border-radius:18px;background:#fff;border:2px solid var(--line);display:flex;gap:10px;align-items:center;position:relative}
.ecard:hover{border-color:var(--accent)}
.ecard .face{width:44px;height:44px;font-size:24px}
.ecard .ring{width:50px;height:50px}.ecard .ring>div{width:38px;height:38px;font-size:18px}
.ecard .n{font-weight:900}.ecard .r{font-size:12px;color:var(--ink-soft);font-weight:700}
.ecard .crown{position:absolute;top:-10px;right:10px;font-size:20px}
.xbtn{float:right;font-size:20px;width:40px;height:40px;border-radius:12px;background:var(--paper-2)}
#custom{position:fixed;right:14px;top:74px;width:270px;padding:16px;display:none}
#custom.show{display:block}
#custom label{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin:8px 0}
#custom input[type=text]{width:140px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);font:inherit;background:#fff}
#custom input[type=color]{width:44px;height:30px;border:0;background:none;padding:0}
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px;
  font-weight:800;font-size:13px;max-width:200px;text-align:center;box-shadow:0 4px 12px rgba(92,58,30,.15);transition:opacity .3s}
.bub:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
#tip{position:fixed;pointer-events:none;padding:4px 10px;border-radius:10px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;display:none}
#toast{position:fixed;left:50%;top:116px;transform:translateX(-50%);padding:10px 16px;display:none;font-weight:800}
#toast.show{display:block;animation:pop .25s}
#hint{position:fixed;left:50%;top:74px;transform:translateX(-50%);font-weight:800;font-size:13px;color:var(--ink-soft);
  background:rgba(255,248,238,.85);padding:6px 12px;border-radius:12px;transition:opacity 1s}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--sky);font-weight:900;font-size:20px;transition:opacity .6s}
body.night{--paper:#2f2a3a;--paper-2:#3c3549;--ink:#f5e9da;--ink-soft:#c9b8a6;--line:#4d4560}
body.night .bub{color:#4a3426}
@media (max-width:760px){
  #nav{top:auto;bottom:96px;left:8px;right:8px;transform:none;flex-direction:row;overflow-x:auto;padding:6px}
  #nav hr{display:none}
  #nav button span{display:none}
  #hud{left:8px;right:8px;bottom:8px;padding:8px 10px}
  .emotes button{width:34px;height:34px;font-size:17px}
  .meter{width:80px}
  #card{left:8px;right:8px;width:auto;bottom:150px}
  #custom{left:8px;right:8px;width:auto}
  .tbtn span{display:none}
  #hint{display:none}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app"></div>
<div id="bubbles"></div>
<div id="tip"></div>
<div id="cross" aria-hidden="true"></div>

<div id="top">
  <div id="brand" class="panel chip"><span class="dot" id="liveDot"></span>Kantor Loker WFH <span id="clock" style="color:var(--ink-soft)"></span></div>
  <div id="tools">
    <button class="panel tbtn" id="bPov" title="Mata owner (V)">👁️<span>POV</span></button>
    <button class="panel tbtn" id="bPerf" title="Kinerja tim">📊<span>Kinerja</span></button>
    <button class="panel tbtn" id="bOver" title="Lihat seluruh gedung">🏢</button>
    <button class="panel tbtn" id="bNight" title="Siang / malam">🌙</button>
    <button class="panel tbtn" id="bCustom" title="Ubah karakter">🎨</button>
  </div>
</div>

<nav id="nav" class="panel" aria-label="Pindah tempat"></nav>

<div id="hud" class="panel">
  <div class="face" id="meFace">😊</div>
  <div>
    <div class="name" id="meName">Kamu</div>
    <div class="mood" id="meMood">Senang</div>
    <div class="meter" title="Energi"><b id="meEnergy" style="width:80%"></b></div>
  </div>
  <div class="emotes">
    <button data-emote="wave" title="Lambai">👋</button>
    <button data-emote="dance" title="Joget">💃</button>
    <button data-emote="cheer" title="Sorak">🙌</button>
    <button data-emote="sit" title="Duduk santai">🪑</button>
  </div>
  <div id="score" title="Skor basket">🏀 0</div>
</div>

<div id="card" class="panel" role="dialog" aria-label="Detail karyawan">
  <button class="close" id="cardClose" aria-label="Tutup">✕</button>
  <div class="head"><div class="face" id="cFace"></div><div><div class="who" id="cName"></div><div class="role" id="cRole"></div></div></div>
  <div class="row">
    <div class="ring" id="cRing"><div id="cMood"></div></div>
    <div><div class="stars" id="cStars"></div><div class="pills" id="cPills"></div></div>
  </div>
  <div class="acts">
    <button data-act="sapa">👋<small>Sapa</small></button>
    <button data-act="tos">✋<small>Tos</small></button>
    <button data-act="kopi">☕<small>Kopi</small></button>
    <button data-act="semangat">💪<small>Semangati</small></button>
  </div>
  <button class="hunt" id="cHuntBtn">🔎 Cari proyek di Freelancer.com sekarang</button>
  <ul class="leads" id="cHunt"></ul>
</div>

<div id="perf"><div class="panel">
  <button class="xbtn" id="perfClose" aria-label="Tutup">✕</button>
  <h2>Kinerja Tim</h2>
  <div class="sub">Perjalanan lamaranmu dan siapa yang paling rajin</div>
  <div class="funnel" id="funnel"></div>
  <div class="grid" id="team"></div>
</div></div>

<div id="custom" class="panel">
  <div style="font-weight:900;font-size:16px;margin-bottom:6px">Karaktermu</div>
  <label>Nama <input type="text" id="cuName" maxlength="14"></label>
  <label>Kulit <input type="color" id="cuSkin"></label>
  <label>Rambut <input type="color" id="cuHair"></label>
  <label>Baju <input type="color" id="cuShirt"></label>
  <label>Celana <input type="color" id="cuPants"></label>
</div>

<div id="toast" class="panel"></div>
<div id="hint">WASD jalan · klik lantai untuk pindah · klik karyawan untuk ngobrol · V mode POV · di lift: E naik, Q turun</div>
<div id="loading">Menyiapkan kantor…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

try { await document.fonts.load('900 80px Nunito'); } catch {}

// ---------- constants ----------
const FH = 4.2, W = 18, D = 12, NF = 7, ROOF = NF;
const ELEV_X = 10.9, DOOR_X = 9.0;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const V = (x, z) => new THREE.Vector3(x, 0, z);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe9f5);
scene.fog = new THREE.Fog(0xcfe9f5, 90, 190);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 400);
camera.position.set(40, 34, 52);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.enableDamping = true;
controls.maxPolarAngle = 1.42;
controls.minDistance = 9;
controls.maxDistance = 120;

const hemi = new THREE.HemisphereLight(0xfff4e0, 0x9cc48f, 1.5);
const sun = new THREE.DirectionalLight(0xffe2b8, 2.3);
sun.position.set(35, 60, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 160 });
sun.shadow.bias = -0.0006;
scene.add(hemi, sun);

// ---------- materials & helpers ----------
const gradient = new THREE.DataTexture(new Uint8Array([110, 185, 255]), 3, 1, THREE.RedFormat);
gradient.minFilter = gradient.magFilter = THREE.NearestFilter;
gradient.needsUpdate = true;
const matCache = new Map();
const glow = []; // materials that light up at night
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!opts.unique && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color, gradientMap: gradient, ...opts.p });
  if (opts.glow) { m.emissive = new THREE.Color(opts.glow); m.emissiveIntensity = 0; glow.push(m); }
  if (!opts.unique) matCache.set(key, m);
  return m;
}
function add(geo, color, x, y, z, parent = scene, o = {}) {
  const m = new THREE.Mesh(geo, o.material || mat(color, o));
  m.position.set(x, y, z);
  if (!geo.boundingSphere) geo.computeBoundingSphere();
  m.castShadow = o.cast !== false && geo.boundingSphere.radius > 0.3;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d, c, x, y, z, p, o) => add(new THREE.BoxGeometry(w, h, d), c, x, y, z, p, o);
const cyl = (rt, rb, h, c, x, y, z, p, o) => add(new THREE.CylinderGeometry(rt, rb, h, 18), c, x, y, z, p, o);
const sph = (r, c, x, y, z, p, o) => add(new THREE.SphereGeometry(r, 18, 14), c, x, y, z, p, o);
function group(x = 0, y = 0, z = 0, parent = scene, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g;
}

// emoji / text textures
const texCache = new Map();
function emojiTex(e, bubble = true) {
  const key = e + bubble;
  if (texCache.has(key)) return texCache.get(key);
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  if (bubble) { g.fillStyle = '#fff'; g.beginPath(); g.arc(64, 60, 52, 0, 7); g.fill(); g.beginPath(); g.moveTo(52, 104); g.lineTo(64, 124); g.lineTo(76, 104); g.fill(); }
  g.font = `${bubble ? 64 : 96}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e, 64, bubble ? 64 : 70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  texCache.set(key, t); return t;
}
function signTex(icon, text, bg, fg) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 192;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.beginPath(); g.roundRect(8, 8, 1008, 176, 70); g.fill();
  g.fillStyle = fg; g.font = '900 88px Nunito, sans-serif'; g.textBaseline = 'middle';
  g.font = '96px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; g.fillText(icon, 50, 100);
  g.font = '900 80px Nunito, sans-serif'; g.fillText(text, 180, 100);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function sign(icon, text, bg, fg, x, y, z, parent, w = 7) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 0.1875), new THREE.MeshBasicMaterial({ map: signTex(icon, text, bg, fg), transparent: true }));
  m.position.set(x, y, z); parent.add(m); return m;
}

// ---------- world: island, water, sky ----------
const water = new THREE.Mesh(new THREE.CircleGeometry(220, 48), mat(0x8fd3e8));
water.rotation.x = -Math.PI / 2; water.position.y = -0.6; scene.add(water);
const island = cyl(52, 50, 1.2, 0x9fd28a, 0, -0.6, 0); island.castShadow = false;
cyl(50.2, 47, 2.4, 0xd9b48a, 0, -1.9, 0).castShadow = false;
function path(x, z, w, d, ry = 0) {
  const p = box(w, 0.06, d, 0xf1dcb5, x, 0.03, z, scene, { cast: false }); p.rotation.y = ry; return p;
}
path(0, 12, 10, 12); path(-22, 9, 26, 3.4); path(22, 9, 26, 3.4); path(-13, 9, 3.4, 8);

// clouds
const clouds = [];
for (let i = 0; i < 9; i++) {
  const g = group(rand(-90, 90), rand(40, 58), rand(-80, 40));
  for (let k = 0; k < 4; k++) sph(rand(2.5, 4.5), 0xffffff, k * 3 - 4, rand(-0.8, 0.8), rand(-1, 1), g, { cast: false });
  g.userData.v = rand(0.6, 1.4); clouds.push(g);
}
// stars (night only)
const starGeo = new THREE.BufferGeometry();
const sp = []; for (let i = 0; i < 500; i++) { const a = rand(0, 6.28), b = rand(0.15, 1.4), r = 180; sp.push(r * Math.cos(b) * Math.cos(a), r * Math.sin(b), r * Math.cos(b) * Math.sin(a)); }
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xfff6d8, size: 1.3, fog: false }));
stars.visible = false; scene.add(stars);

// ---------- clickable registry ----------
const clickables = []; // meshes with userData.{kind,...}
function tag(obj, data) { obj.traverse(o => { if (o.isMesh) { o.userData = { ...o.userData, ...data }; clickables.push(o); } }); }
const walkables = []; // {mesh, level}

// ---------- props ----------
function plant(x, z, p, s = 1) {
  const g = group(x, 0, z, p);
  cyl(0.28 * s, 0.22 * s, 0.45 * s, 0xd98b5f, 0, 0.22 * s, 0, g);
  sph(0.45 * s, 0x6fae6a, 0, 0.75 * s, 0, g); sph(0.32 * s, 0x86c47c, 0.2 * s, 1.0 * s, 0.1 * s, g);
  return g;
}
function chair(x, z, ry, p, color = 0x7a8fb8) {
  const g = group(x, 0, z, p, ry);
  box(0.55, 0.08, 0.55, color, 0, 0.48, 0, g); box(0.55, 0.6, 0.08, color, 0, 0.8, -0.26, g);
  cyl(0.04, 0.04, 0.44, 0x555555, 0, 0.24, 0, g); cyl(0.25, 0.25, 0.04, 0x555555, 0, 0.02, 0, g);
  return g;
}
const screens = [];
function desk(x, z, ry, p, screen = 0x8fd0ff, chairColor) {

  if (!cands.length) { toast('Lagi dipakai, coba yang lain 🙂'); return; }
  const s = cands.reduce((a, b) => dist(a) < dist(b) ? a : b);
  function dist(s) { return s.swing ? 0 : Math.hypot(s.x - me.pos.x, s.z - me.pos.z) + Math.abs(s.level - me.level) * 20; }
  me.leaveSpot();
  sendTo(me, s, () => {
    say(me, { bench: 'Duduk santai dulu 😌', swing: 'Wiii~ 🎶', picnic: 'Piknik kecil 🧺', pond: 'Bebeknya lucu 🦆', ping: 'Ayo tanding! 🏓', slide: 'Seluncur! 🛝', kafe: 'Satu kopi susu ya ☕', kopi: 'Ngopi dulu ☕', hammock: 'Ngadem di atap… 😴', parasol: 'Cerah banget hari ini 🌤️', sofa: 'Empuk~ 🛋️' }[s.kind] || '😊');
    if (s.kind === 'kafe' || s.kind === 'kopi') { me.energy = clamp(me.energy + 30, 0, 100); burst(new THREE.Vector3(me.pos.x, me.y, me.pos.z), ['☕', '💨', '✨']); }
  });
}
let shooting = false;
function goShoot() {
  const s = spots.find(x => x.kind === 'hoop');
  if (s.by && s.by !== me) { toast('Ring lagi dipakai, tunggu sebentar 🏀'); return; }
  me.leaveSpot();
  sendTo(me, s, () => { me.pose = 'stand'; shoot(); });
}
function shoot() {
  if (shooting) return; shooting = true;
  const from = new THREE.Vector3(me.pos.x + 0.2, 2.2, me.pos.z - 0.2);
  const to = new THREE.Vector3(28, 3.05, -12.55);
  const chance = 0.35 + me.energy / 250 + (me.mood === 'semangat' ? 0.15 : 0);
  const made = Math.random() < chance;
  if (!made) to.x += pick([-0.7, 0.7]);
  me.doEmote('jump', 0.8);
  let u = 0;
  const fly = (t, dt) => {
    u += dt / 1.0;
    const k = Math.min(u, 1);
    ball.position.lerpVectors(from, to, k); ball.position.y += Math.sin(k * Math.PI) * 2.6;
    if (u >= 1) {
      animated.splice(animated.indexOf(fly), 1);
      ball.position.set(to.x, 0.26, to.z + 1.5);
      shooting = false;
      if (made) { me.hoopScore++; $('score').textContent = '🏀 ' + me.hoopScore; me.joy = clamp(me.joy + 10, 0, 100); me.doEmote('cheer'); burst(to.clone().setY(1), ['🎉', '⭐', '✨'], 10); say(me, pick(['Masuk!! 🎉', 'Swish! 😎', 'Yesss!'])); staff.filter(c => c.spot?.kind?.match(/ping|slide|swing/)).forEach(c => c.doEmote('cheer')); }
      else { me.doEmote('sigh', 1.2); say(me, pick(['Yah meleset 😅', 'Dikit lagi!', 'Sekali lagi!'])); }
      setTimeout(() => { ball.position.set(me.pos.x + 0.6, 0.26, me.pos.z); }, 500);
    }
  };
  animated.push(fly);
}

// ---------- emotes from HUD ----------
document.querySelectorAll('[data-emote]').forEach(b => b.onclick = () => {
  const e = b.dataset.emote;

});

// ---------- UI: nav ----------
const PLACES = [
  { icon: '🌳', name: 'Taman', go: () => me.goTo(0, -25, 8) },

// ---------- UI: card ----------
const scoreColor = s => s >= 0.6 ? 'var(--good)' : s >= 0.4 ? 'var(--mid)' : s >= 0.2 ? 'var(--low)' : 'var(--idle)';
const starsHtml = s => { const n = Math.round(s * 5); return '★'.repeat(n) + `<span class="off">${'★'.repeat(5 - n)}</span>`; };
const hex = n => '#' + n.toString(16).padStart(6, '0');
function faceStyle(c) { return `background:${hex(c.look.shirt)}`; }
function openCard(c) {
  const p = c.perfNow;
  $('cFace').textContent = MOODS[c.mood].emo; $('cFace').style.cssText = faceStyle(c);
  $('cName').textContent = c.name; $('cRole').textContent = c.def.role;

  $('card').classList.add('show');
}

// ---------- real hunt: Lido runs the bot's Freelancer.com fetcher ----------
let hunting = false;
function showLeads(list) {
  $('cHunt').replaceChildren(...list.map(l => {
    const li = document.createElement('li'), a = document.createElement('a'), sm = document.createElement('small');
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = (l.kind === 'source_code' ? '💾 ' : '💼 ') + l.title;
    sm.textContent = l.budget || 'Budget belum ditulis';
    a.appendChild(sm); li.appendChild(a); return li;
  }));
}
$('cHuntBtn').onclick = async () => {
  const c = chatWith; if (!c || hunting) return;
  if (!live) { toast('Jalankan: python -m bot_loker_wfh office supaya Lido bisa mencari beneran'); return; }
  hunting = true; $('cHuntBtn').disabled = true; $('cHuntBtn').textContent = '⏳ Lido lagi mencari…';
  c.showEmo('🔎'); c.doEmote('nod', 30); say(c, 'Bentar ya, aku cek Freelancer.com… 🔎', 30);
  let res = null;
  try { const r = await fetch('hunt/freelancer', { method: 'POST' }); res = r.ok ? await r.json() : { error: r.status }; }
  catch { res = { error: 'offline' }; }
  hunting = false; $('cHuntBtn').disabled = false; $('cHuntBtn').textContent = '🔎 Cari lagi';
  c.emote = null;
  const at = new THREE.Vector3(c.pos.x, c.y, c.pos.z);
  if (res.error) {
    c.sadUntil = clock.elapsedTime + 20; c.doEmote('sigh', 2.5);
    say(c, res.error === 409 ? 'Aku masih nyari, sabar ya 🙏' : 'Gagal nyambung ke Freelancer 😢 coba lagi nanti');
    return;
  }
  showLeads(res.top);
  if (res.inserted > 0) {
    c.boost = 2; c.boostUntil = clock.elapsedTime + 90; c.doEmote('cheer', 2.5);
    burst(at, ['💼', '✨', '🎉'], 10); say(c, `Dapet ${res.inserted} proyek baru yang cocok! 🎉`);
    toast(`💼 Lido menemukan ${res.inserted} proyek baru di Freelancer.com`);
    me.joy = clamp(me.joy + 10, 0, 100);
  } else {
    c.doEmote('nod', 1.5); say(c, 'Belum ada yang baru. Ini yang terakhir aku simpan 👇');
  }
  await loadStats(); openCard(c);
};
function closeCard() { $('card').classList.remove('show'); }
$('cardClose').onclick = endChat;
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));

// ---------- UI: performance panel ----------
let perfOpen = false;
function renderPerf() {
  const d = derive();
  const steps = [['🔎', 'Ditemukan', d.total, '#7aa6d8'], ['✅', 'Lolos seleksi', d.cand, '#6bb38a'], ['📝', 'Draf lamaran', d.drafted, '#d98b5f'], ['🚀', 'Terkirim', d.sent, '#4ea7c4'], ['👀', 'Direspons', d.responded, '#b48ad8'], ['🎤', 'Interview', d.interview, '#d8738f'], ['🏆', 'Offer', d.offer, '#f2b84b']];
  const mx = Math.log10(Math.max(...steps.map(s => s[2]), 1) + 1);
  $('funnel').innerHTML = steps.map(([i, n, v, c]) => `<div class="step"><div class="bar" style="background:${c}33;height:${44 + 76 * Math.log10(v + 1) / mx}px;border:2px solid ${c}">${i}</div><b>${v}</b><small>${n}</small></div>`).join('');
  const ranked = [...staff].sort((a, b) => b.perfNow.score - a.perfNow.score);
  $('team').innerHTML = ranked.map((c, i) => `<button class="ecard" data-id="${c.def.id}">${i === 0 && c.perfNow.score > 0 ? '<span class="crown" title="Karyawan terbaik">👑</span>' : ''}
    <div class="face" style="${faceStyle(c)}">${MOODS[c.mood].emo}</div>
    <div style="flex:1;min-width:0"><div class="n">${c.name}</div><div class="r">${c.def.role}</div><div class="stars" style="font-size:14px">${starsHtml(c.perfNow.score)}</div>
    <div class="pills">${c.perfNow.pills.map(([ic, v]) => `<span class="pill">${ic} ${v}</span>`).join('')}</div></div>
    <div class="ring" style="--p:${Math.round(c.perfNow.score * 100)};--c:${scoreColor(c.perfNow.score)}"><div>${DIVS.find(x => x.id === c.def.div).icon}</div></div></button>`).join('');
  $('team').querySelectorAll('.ecard').forEach(b => b.onclick = () => { togglePerf(false); overview = false; startChat(staff.find(c => c.def.id === b.dataset.id)); });
}
function togglePerf(v = !perfOpen) { perfOpen = v; $('perf').classList.toggle('show', v); if (v) renderPerf(); }
$('bPerf').onclick = () => togglePerf();
$('perfClose').onclick = () => togglePerf(false);

// ---------- UI: customize ----------
const cu = { name: $('cuName'), skin: $('cuSkin'), hair: $('cuHair'), shirt: $('cuShirt'), pants: $('cuPants') };
Object.entries(cu).forEach(([k, el]) => { el.value = myLook[k]; el.oninput = () => {

}; });

// ---------- UI: night / overview / toast ----------
let night = false;
function setNight(v) {
  night = v; document.body.classList.toggle('night', v); $('bNight').textContent = v ? '☀️' : '🌙';
  const sky = v ? 0x2b2d52 : 0xcfe9f5;
  scene.background.set(sky); scene.fog.color.set(sky);
  hemi.intensity = v ? 0.55 : 1.5; hemi.color.set(v ? 0x8a8fd8 : 0xfff4e0);
  sun.intensity = v ? 0.35 : 2.3; sun.color.set(v ? 0x9fb0ff : 0xffe2b8);
  glow.forEach(m => m.emissiveIntensity = v ? 1 : 0.15);
  screens.forEach(s => s.material.emissiveIntensity = v ? 0.9 : 0.35);
  stars.visible = v; water.material.color.set(v ? 0x3e5c86 : 0x8fd3e8);
}
$('bNight').onclick = () => setNight(!night);
let overview = false;
$('bOver').onclick = () => { overview = !overview; endChat(); };
let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200); }
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); }, 1000);

// ---------- pointer: hover + click ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
function hitAt(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const targets = clickables.filter(o => isShown(o)).concat(walkables.filter(w => isShown(w.mesh)).map(w => w.mesh), [island]);
  return ray.intersectObjects(targets, false)[0];
}
function isShown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  interact(hitAt(e));
});
function interact(h) {
  if (!h) return;
  const ud = h.object.userData;
  $('custom').classList.remove('show');
  if (ud.kind === 'char' && ud.char !== me) { overview = false; startChat(ud.char); return; }
  if (ud.kind === 'char' && ud.char === me) { me.doEmote(pick(['wave', 'dance', 'cheer'])); say(me, MOODS[me.mood].emo + ' ' + MOODS[me.mood].label); return; }
  if (ud.kind === 'spot') { overview = false; useSpot(ud.kindName); return; }
  endChat();
  const w = walkables.find(x => x.mesh === h.object);
  const level = w ? w.level : 0;
  let { x, z } = h.point;
  if (level > 0) { x = clamp(x, -W / 2 + 0.6, W / 2 - 0.4); z = clamp(z, -D / 2 + 0.6, D / 2 - 0.4); }
  else if (Math.hypot(x, z) > 46) return;
  overview = false;
  me.goTo(level, x, z);
  burst(new THREE.Vector3(x, level * FH - 1.8, z), ['📍'], 1);
}
renderer.domElement.addEventListener('pointermove', e => {
  if (fp && downAt && e.buttons) {
    yaw -= e.movementX * 0.005; pitch = clamp(pitch - e.movementY * 0.004, -1.2, 1.1);
    $('tip').style.display = 'none'; return;
  }
  const h = hitAt(e); const ud = h?.object.userData || {};
  const tip = $('tip');
  if (ud.kind === 'char') { tip.style.display = 'block'; tip.textContent = ud.char === me ? myLook.name : `${ud.char.name} · ${ud.char.def.role}`; }
  else if (ud.kind === 'spot') { tip.style.display = 'block'; tip.textContent = { bench: 'Duduk di bangku', swing: 'Main ayunan', picnic: 'Piknik', pond: 'Lihat bebek', hoop: 'Main basket', ping: 'Main pingpong', slide: 'Main seluncuran', kafe: 'Beli kopi', hammock: 'Rebahan di hammock', parasol: 'Bersantai', kopi: 'Ngopi', sofa: 'Duduk di sofa' }[ud.kindName] || 'Main'; }
  else tip.style.display = 'none';
  tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px';
  renderer.domElement.style.cursor = ud.kind ? 'pointer' : 'default';
});

// ---------- floor visibility (cutaway) ----------
function updateCutaway() {
  const inside = me.level > 0 || inTower(me.pos);
  const lvl = overview || fp || !inside ? 99 : Math.max(me.level, Math.round(me.y / FH));
  floors.forEach((g, i) => g.visible = i <= lvl);
  roof.visible = ROOF <= lvl;
  for (const c of chars) c.p.root.visible = !(c.level > lvl && (c.level > 0 || inTower(c.pos))) || !!c.ride;
}

// ---------- camera follow ----------
const lastTarget = new THREE.Vector3();
function updateCamera(dt) {
  if (fp) {
    if (me.path.length && me.walking) { const d = me.targetRy - yaw; yaw += Math.atan2(Math.sin(d), Math.cos(d)) * Math.min(1, dt * 4); }
    me.ry = me.targetRy = yaw;
    me.p.head.getWorldPosition(tmpV);
    camera.position.set(tmpV.x + Math.sin(yaw) * 0.12, tmpV.y + 0.08, tmpV.z + Math.cos(yaw) * 0.12);
    camera.lookAt(camera.position.x + Math.sin(yaw) * Math.cos(pitch), camera.position.y + Math.sin(pitch), camera.position.z + Math.cos(yaw) * Math.cos(pitch));
    return;
  }
  const want = overview ? new THREE.Vector3(5, 12, 0) : new THREE.Vector3(me.pos.x, me.y + 1.2, me.pos.z);
  const delta = want.sub(controls.target).multiplyScalar(Math.min(1, dt * 3));
  controls.target.add(delta); camera.position.add(delta);
  if (overview && camera.position.distanceTo(controls.target) < 50) camera.position.addScaledVector(camera.position.clone().sub(controls.target).normalize(), dt * 30);
}

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  keyMove(dt);
  for (const f of [...animated]) f(t, dt);
  for (const c of staff) updateStaff(c, dt, t);
  updateMe(dt, t);
  for (const c of chars) c.update(dt, t);
  swings.forEach(s => { if (!spots.some(sp => sp.swing === s && sp.by && sp.by.pose === 'swing')) s.rotation.x *= 0.96; });
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 110) c.position.x = -110; });
  trees.forEach(tr => tr.rotation.z = Math.sin(t * 0.8 + tr.userData.sway) * 0.02);
  updateParts(dt); updateCutaway(); updateCamera(dt); if (!fp) controls.update();
  renderer.render(scene, camera);
  updateBubbles();
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { endChat(); togglePerf(false); $('custom').classList.remove('show'); }
  if (k === 'v') setFP(!fp);
  if ((k === 'e' || k === 'q') && inShaft(me.pos) && !me.ride) {
    const to = clamp(me.level + (k === 'e' ? 1 : -1), 0, ROOF);
    if (to !== me.level) { me.stop(); me.path = [{ ride: to }, { p: V(DOOR_X, 0) }]; }
  } else if (k === 'e' && fp) {
    interact(hitAt({ clientX: innerWidth / 2, clientY: innerHeight / 2 }));
  }
});

// ---------- owner POV (first person) ----------
let fp = false, yaw = 0, pitch = 0;
function setFP(v) {
  fp = v; overview = false;
  controls.enabled = !v;
  me.p.body.visible = !v; me.bubble.visible = !v; ring.visible = !v;
  camera.fov = v ? 72 : 42; camera.near = v ? 0.05 : 0.5; camera.updateProjectionMatrix();
  $('bPov').classList.toggle('on', v); $('cross').style.display = v ? 'block' : 'none';
  if (v) { yaw = me.ry; pitch = -0.05; toast('👁️ Mode POV: geser mouse untuk melihat · WASD jalan · klik / E untuk menyapa · V keluar'); }
  else {
    camera.position.set(me.pos.x + 22, me.y + 18, me.pos.z + 28);
    controls.target.set(me.pos.x, me.y + 1.2, me.pos.z);
  }
}
$('bPov').onclick = () => setFP(!fp);

const h = new Date().getHours(); setNight(h >= 18 || h < 6);
await loadStats();
setInterval(loadStats, 60000);
staff.forEach(c => c.setMood(staffMood(c, 0)));
$('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 700);
setTimeout(() => $('hint').style.opacity = 0, 12000);
setTimeout(() => { say(me, `Halo! Ini kantor bot lokermu 🏢`); toast(live ? '🟢 Terhubung ke data bot' : '🟡 Pakai data contoh'); }, 900);
frame();
