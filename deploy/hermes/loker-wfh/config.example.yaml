gateway:
  api_server:
    enabled: true
    host: 127.0.0.1
    port: 8642
    max_concurrent_runs: 4
  platforms:
    api_server:
      direct_model_requests: false
      model_routes:
        loker-draft:
          model: "REPLACE_WITH_CONFIGURED_PROVIDER_MODEL"
        loker-form:
          model: "REPLACE_WITH_CONFIGURED_PROVIDER_MODEL"
        loker-answer:
          model: "REPLACE_WITH_CONFIGURED_PROVIDER_MODEL"

platform_toolsets:
  api_server:
    - skills
    - memory
    - delegation

skills:
  external_dirs:
    - ${LOKER_WFH_HERMES_SKILLS_DIR}

delegation:
  max_concurrent_children: 2
  max_iterations: 24
  max_spawn_depth: 1

agent:
  max_iterations: 12
  # `skills` also contains skill_manage; the app needs read-only skill lookup only.
  disabled_toolsets:
    - skill_manage
